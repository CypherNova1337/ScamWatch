name: False positive
description: The tool flagged something legitimate. This is the most important bug we can get.
title: "[FP] "
labels: ["false-positive", "priority"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you — genuinely. A false positive means the tool nearly asked a
        registrar to take a real site offline. Nothing gets fixed faster.
  - type: input
    id: domain
    attributes:
      label: Domain it flagged
      placeholder: example.com
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Which tier
      options: ["confirmed (a report was written)", "review (a note only)"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is the site actually?
      placeholder: A computer repair business in Melbourne. Real company, real address.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Paste the report
      description: The generated .md, or the matched indicators and score. Redact anything you would rather not publish.
      render: markdown
